<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0E1C3A"/>
      <stop offset="100%" stop-color="#0A2D3E"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Subtle warm glow behind number -->
  <radialGradient id="warmGlow" cx="44%" cy="50%" r="40%">
    <stop offset="0%" stop-color="#FF9420" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#FF9420" stop-opacity="0"/>
  </radialGradient>
  <rect width="1024" height="1024" fill="url(#warmGlow)"/>

  <!-- Number: left-aligned to leave room for arrow -->
  <!-- Glow pass -->
  <text x="200" y="600"
        font-family="-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="340" font-weight="800"
        text-anchor="start"
        fill="#FF9420" fill-opacity="0.28"
        filter="url(#glow)">5.8</text>
  <!-- Solid pass -->
  <text x="200" y="600"
        font-family="-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="340" font-weight="800"
        text-anchor="start"
        fill="#FF9420">5.8</text>

  <!-- Trend arrow ↗ — top right, large and bold -->
  <!-- Glow -->
  <polyline points="720,220 860,220 860,360"
            fill="none" stroke="#FF9420" stroke-width="52"
            stroke-linecap="round" stroke-linejoin="round"
            fill-opacity="0" stroke-opacity="0.22"
            filter="url(#glow)"/>
  <line x1="690" y1="390" x2="860" y2="220"
        stroke="#FF9420" stroke-width="52" stroke-linecap="round"
        stroke-opacity="0.22" filter="url(#glow)"/>
  <!-- Solid -->
  <polyline points="720,220 860,220 860,360"
            fill="none" stroke="#FF9420" stroke-width="52"
            stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="690" y1="390" x2="860" y2="220"
        stroke="#FF9420" stroke-width="52" stroke-linecap="round"/>

  <!-- Unit — bottom, subtle -->
  <text x="512" y="760"
        font-family="-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="72" font-weight="400" letter-spacing="3"
        text-anchor="middle"
        fill="white" fill-opacity="0.28">mmol/L</text>
</svg>
